name: knowledge-base-infra
services:
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: kb-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/kb-minio:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: kb-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://kb-milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ./volumes/kb-milvus-etcd:/etcd

  milvus-minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: kb-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ./volumes/kb-milvus-minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.5
    container_name: kb-milvus-standalone
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: kb-milvus-etcd:2379
      MINIO_ADDRESS: kb-milvus-minio:9000
    volumes:
      - ./volumes/kb-milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - milvus-minio

  attu:
    image: zilliz/attu:v2.5.5
    container_name: kb-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: kb-milvus-standalone:19530
    ports:
      - "7000:3000"
    depends_on:
      - milvus

  mongo:
    image: mongo:latest
    container_name: kb-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./volumes/kb-mongo:/data/db


