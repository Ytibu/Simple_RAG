[project]
name = "knowledge-base"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.162.5",
    "grandalf>=0.8",
    "langchain>=1.5.0",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymilvus>=3.0.3",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone"
