[project]
name = "knowledge-base"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.5",
    "flagembedding>=1.4.2",
    "grandalf>=0.8",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "modelscope>=1.40.3",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "py-import-checker>=0.2.5",
    "pydantic>=2.14.3",
    "pymilvus>=3.0.3",
    "pymilvus-model>=0.3.4",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "regex>=2026.11.9",
    "requests>=2.34.2",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.2",
    "unicorn>=2.1.4",
]

[tool.uv]
python-install-mirror = "https://registry.npmmirror.com/-/binary/python-build-standalone"
