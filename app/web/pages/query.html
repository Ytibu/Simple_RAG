<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <title>智能咨询 · 知识库</title>
    <link rel="stylesheet" href="/static/workspace.css">
    <link rel="stylesheet" href="/static/query.css?v=5">
    <script src="/static/query.js?v=4" defer></script>
</head>
<body class="workspace query-page">
    <aside class="workspace-sidebar">
        <a class="workspace-brand" href="/">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span>知识库<small>智能咨询系统</small></span>
        </a>
        <nav aria-label="工作台导航">
            <a href="/query" aria-current="page">智能咨询</a>
            <a href="/import">资料导入</a>
        </nav>
    </aside>
    <main class="workspace-main">
        <header class="workspace-header">
            <span id="connection-status" role="status">正在连接服务…</span>
            <button id="clear-history" class="secondary-button" type="button">清空历史</button>
            <button id="new-session" class="secondary-button" type="button">＋ 新建会话</button>
        </header>
        <div id="chat-scroll" class="chat-scroll" role="region" aria-label="对话消息" tabindex="0">
            <div class="chat-column chat-messages">
                <section id="welcome" aria-labelledby="welcome-heading">
                    <div class="consult-hero">
                        <h1 id="welcome-heading">知识库智能咨询</h1>
                        <p>根据已导入的资料回答问题，附上原文出处，方便核对和追问。</p>
                    </div>
                    <div class="prompt-options" aria-label="提问示例">
                        <button type="button" data-question="H3C LA2608 支持哪些厂商的无线控制器？">
                            <strong>查询兼容性</strong><span>设备支持哪些无线控制器？</span>
                        </button>
                        <button type="button" data-question="请根据手册说明 H3C LA2608 的初始配置步骤。">
                            <strong>查找配置步骤</strong><span>设备初次使用时如何配置？</span>
                        </button>
                        <button type="button" data-question="如果 H3C LA2608 无法连接无线控制器，手册建议检查哪些项目？">
                            <strong>排查故障</strong><span>无法连接控制器时如何排查？</span>
                        </button>
                    </div>
                </section>
                <ol id="history" class="conversation" aria-label="本次会话" aria-live="polite"></ol>
            </div>
        </div>
        <div class="chat-footer">
            <div class="chat-column">
                <form id="query-form" class="composer">
                    <textarea id="question" rows="2" maxlength="4000" required aria-label="向知识库提问" placeholder="输入设备型号、配置需求或遇到的问题…"></textarea>
                    <div class="composer-actions">
                        <label class="retrieval-option" title="生成假设性文档辅助匹配相关资料">
                            <input id="hyde" type="checkbox" checked> 增强检索
                        </label>
                        <label class="retrieval-option"><input id="web-search" type="checkbox"> 联网搜索</label>
                        <label class="retrieval-option"><input id="stream-answer" type="checkbox" checked> 流式输出</label>
                        <button id="submit" class="primary-button" type="submit">发送 <span aria-hidden="true">↑</span></button>
                    </div>
                </form>
                <p id="feedback" role="status"></p>
            </div>
        </div>
    </main>
</body>
</html>
